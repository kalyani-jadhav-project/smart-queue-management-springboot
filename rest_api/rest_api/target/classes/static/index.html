<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Queue — Live Counter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="blob blob-1"></div>
<div class="blob blob-2"></div>

<div class="board">

  <header class="board-header">
    <div class="brand">
      <span class="brand-icon">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2a2 2 0 0 0 0-4Z"/>
          <path d="M13 5v2M13 17v2M13 11v2"/>
        </svg>
      </span>
      <div>
        <p class="brand-name">QueueUp</p>
        <p class="brand-sub">Live counter status</p>
      </div>
    </div>
    <div class="clock">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
      <span id="clock">--:--:--</span>
    </div>
  </header>

  <section class="now-serving" aria-live="polite">
    <p class="now-serving-label">
      <svg id="bellIcon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      Now Serving
    </p>
    <div class="flap-display" id="flapNumber">
      <span class="flap-digit">0</span><span class="flap-digit">0</span><span class="flap-digit">0</span>
    </div>
    <p class="now-serving-name" id="servingName">Counter is idle</p>
    <button class="btn btn-primary" id="callNextBtn">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      Call Next
    </button>
  </section>

  <main class="grid">

    <section class="panel ticket-panel">
      <h2 class="panel-title">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Join the Queue
      </h2>
      <form id="addForm" class="ticket-form">
        <label for="customerName">Customer name</label>
        <input type="text" id="customerName" placeholder="e.g. Rukmini Rao" required autocomplete="off">
        <button type="submit" class="btn btn-accent">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
          Issue Token
        </button>
      </form>
      <p class="ticket-hint">A token number is assigned the moment you submit.</p>
    </section>

    <section class="panel list-panel">
      <div class="panel-head">
        <h2 class="panel-title">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
          Queue Status
        </h2>
        <div class="tabs" id="tabs">
          <button class="tab active" data-filter="WAITING">Waiting</button>
          <button class="tab" data-filter="SERVING">Serving</button>
          <button class="tab" data-filter="COMPLETED">Completed</button>
          <button class="tab" data-filter="ALL">All</button>
        </div>
      </div>
      <div class="list" id="queueList"></div>
      <div class="empty-state" id="emptyState" hidden>
        <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z"/><path d="M3 21v-1a6 6 0 0 1 6-6h0"/><path d="M16 11l2 2 4-4"/></svg>
        <p>No entries here yet.</p>
      </div>
    </section>

  </main>

  <footer class="board-footer">
    <span id="statusMsg" role="status"></span>
  </footer>

</div>

<script src="app.js"></script>
</body>
</html>
